{% extends "base.html" %}

{% block title %}
Reminder Detail
{% endblock %}

{% block content %}
<div>
    <h3>{{ reminder.id }}. {{ reminder.title }}</h3>
    <p> {{ reminder.date}} {{ reminder.time }}</p>
    <p> {{ reminder.description }}</p>
    <button><a href= "{% url 'update_reminder' reminder.id %}">Edit</a></button>
    <button><a href= "{% url 'delete_reminder' reminder.id %}">Delete</a></button>
</div>
{% endblock %}
